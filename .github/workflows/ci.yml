name: Telco Churn Prediction CI/CD


on:
    push:
        branches: [ main ]


jobs:
    lint:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout the code
              uses: actions/checkout@v4

            - name: Install Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.11'

            - name: Install ruff
              run: |
                pip install uv
                uv pip install --system ruff

            - name: Run linting
              run: ruff check . --fix


    test:
        needs: lint
        runs-on: ubuntu-latest

        steps:
            - name: Checkout the code
              uses: actions/checkout@v4

            - name: Install Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.11'

            - name: Install dependencies
              run: |
                pip install uv
                uv pip install --system -r requirements.txt

            - name: Run pytest
              env:
                DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_USER_TOKEN }}
                DAGSHUB_REPO_OWNER: ${{ secrets.DAGSHUB_REPO_OWNER }}
                DAGSHUB_REPO_NAME: ${{ secrets.DAGSHUB_REPO_NAME }}
              run: pytest

    # ------------------------------------------------------------------ #
    docker-build-push:
        needs: test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout the code
              uses: actions/checkout@v4

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build and push Docker image
              uses: docker/build-push-action@v6
              with:
                context: .
                file: ./dockerfile
                push: true
                tags: |
                  ${{ secrets.DOCKERHUB_USERNAME }}/telco-churn-prediction:latest
                  ${{ secrets.DOCKERHUB_USERNAME }}/telco-churn-prediction:${{ github.sha }}
                cache-from: type=gha
                cache-to: type=gha,mode=max